user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    # ─── Performance ──────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    reset_timedout_connection on;

    # Gzip compression
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   4;
    gzip_min_length   1000;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml font/opentype image/svg+xml;

    # Client body
    client_max_body_size    20M;
    client_body_buffer_size 128k;
    client_header_timeout   15s;
    client_body_timeout     15s;
    send_timeout            15s;

    # ─── Security ─────────────────────────────────────────────────────────────
    server_tokens off;

    # ─── Rate Limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=60r/m;
    limit_req_status 429;

    # ─── Upstreams ────────────────────────────────────────────────────────────
    upstream app {
        server app:3000;
        keepalive 64;
    }

    upstream socket_io {
        # Socket.io — ip_hash agar satu client selalu ke server yang sama
        ip_hash;
        server socket:13337;
        keepalive 32;
    }

    upstream socket_api {
        server socket:13338;
        keepalive 16;
    }

    # ─── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Allow Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS Main Server ────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name bizgrow.id app.bizgrow.id;  # Ganti dengan domain kamu

        # SSL
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # Security Headers
        add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options              "DENY" always;
        add_header X-Content-Type-Options       "nosniff" always;
        add_header X-XSS-Protection             "1; mode=block" always;
        add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()" always;

        # ── Socket.io WebSocket (path: /socket.io/) ──────────────────────────
        location /socket.io/ {
            proxy_pass http://socket_io;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Proxy headers
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            # Timeouts panjang untuk koneksi Socket.io yang long-running
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
            proxy_connect_timeout 75s;

            # Disable buffering untuk realtime
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Auth endpoints — rate limited ────────────────────────────────────
        location ~ ^/(auth|api/auth)/(login|register|forgot-password) {
            limit_req zone=login burst=20 nodelay;
            proxy_pass http://app;
            include /etc/nginx/proxy_params.conf;
        }

        # ── WhatsApp webhook — rate limited ──────────────────────────────────
        location /api/webhook-wa {
            limit_req zone=webhook burst=10 nodelay;
            proxy_pass http://app;
            include /etc/nginx/proxy_params.conf;
        }

        # ── API endpoints — rate limited ─────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://app;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Static assets — cache lama ────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            proxy_pass http://app;
            include /etc/nginx/proxy_params.conf;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Health check ─────────────────────────────────────────────────────
        location /health {
            proxy_pass http://app;
            access_log off;
        }

        # ── Semua request lainnya ─────────────────────────────────────────────
        location / {
            proxy_pass http://app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
        }
    }
}
