name: KMP Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # bisa trigger manual dari GitHub UI

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      working-directory: ./multi_platform/bizgrow-kmp

    - name: Set Gradle properties for CI
      run: |
        cat > multi_platform/bizgrow-kmp/gradle.properties << 'EOF'
        android.useAndroidX=true
        kotlin.native.ignoreDisabledTargets=true
        org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
        org.gradle.caching=true
        org.gradle.parallel=true
        org.gradle.workers.max=2
        kotlin.compiler.execution.strategy=in-process
        EOF

    - name: Build Debug APK
      run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace
      working-directory: ./multi_platform/bizgrow-kmp
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BizgrowApp-debug-${{ github.run_number }}
        path: multi_platform/bizgrow-kmp/androidApp/build/outputs/apk/debug/androidApp-debug.apk
        retention-days: 7

    - name: Show APK info
      run: |
        echo "✅ APK berhasil dibuild!"
        ls -lh multi_platform/bizgrow-kmp/androidApp/build/outputs/apk/debug/
