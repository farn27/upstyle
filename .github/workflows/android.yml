name: KMP Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      working-directory: ./multi_platform/bizgrow-kmp

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: ./multi_platform/bizgrow-kmp

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bizgrow-kmp-debug
        path: multi_platform/bizgrow-kmp/androidApp/build/outputs/apk/debug/androidApp-debug.apk
